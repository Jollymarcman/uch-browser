<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#142132">
    <title>Ultimate Chicken Horse WebGL Playtest</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, Segoe UI, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: #111820; }
      body { display: grid; place-items: center; }
      #game-shell { width: min(100vw, 160vh); aspect-ratio: 8 / 5; position: relative; background: #231f20; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #231f20; }
      #startup { position: absolute; z-index: 2; inset: 0; display: grid; place-items: center;
        padding: 20px; background: radial-gradient(ellipse at 50% 25%, #315570 0%, #142132 72%); }
      .card { width: min(100%, 510px); padding: 28px; border: 1px solid #7794a8; border-radius: 14px;
        background: #162635ed; box-shadow: 0 18px 60px #0008; text-align: center; }
      h1 { margin: 0 0 8px; font-size: clamp(24px, 4vw, 34px); color: #fff; }
      .intro { margin: 0 0 22px; color: #cfdae2; }
      .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      button { min-height: 58px; border: 1px solid #a9c6d6; border-radius: 9px; background: #42677c;
        color: white; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; }
      button:hover, button:focus-visible { background: #5487a0; outline: 3px solid #f7d56a; outline-offset: 2px; }
      button small { display: block; margin-top: 3px; font-size: 12px; font-weight: 400; }
      .note { margin: 18px 0 0; color: #b6c5cf; font-size: 12px; line-height: 1.45; }
      #loading { display: none; position: absolute; inset: 0; z-index: 3; place-items: center;
        background: #111820; color: white; text-align: center; }
      .load-card { width: min(90%, 420px); }
      .track { height: 12px; margin-top: 14px; border-radius: 99px; background: #394550; overflow: hidden; }
      #progress { width: 0; height: 100%; background: #9acb7b; transition: width .15s linear; }
      #failure { display: none; margin-top: 12px; color: #ff9c91; white-space: pre-wrap; }
      @media (max-width: 520px) { .choices { grid-template-columns: 1fr; } .card { padding: 22px; } }
    </style>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="unity-canvas" width="960" height="600" aria-label="Ultimate Chicken Horse"></canvas>
      <section id="startup" aria-labelledby="title">
        <div class="card">
          <h1 id="title">Choose your game mode</h1>
          <p class="intro">Pick the setting that suits this device before the game starts.</p>
          <div class="choices">
            <button id="normal">Normal<small>Original quality settings</small></button>
            <button id="performance">Performance<small>Lower graphics memory and 30 fps</small></button>
          </div>
          <p class="note">Performance mode uses the game's Low texture profile and a smaller render buffer. The game still loads its original assets, so this does not cap total browser memory.</p>
        </div>
      </section>
      <section id="loading" aria-live="polite">
        <div class="load-card">
          <div id="load-label">Loading original game…</div>
          <div class="track"><div id="progress"></div></div>
          <div id="failure"></div>
        </div>
      </section>
    </main>
    <script src="Build/UCH-WebGL-MovementDiagnostics-20261123-220843.loader.js"></script>
    <script>
      const canvas = document.querySelector('#unity-canvas');
      const startup = document.querySelector('#startup');
      const loading = document.querySelector('#loading');
      const progress = document.querySelector('#progress');
      const label = document.querySelector('#load-label');
      const failure = document.querySelector('#failure');

      async function startGame(mode) {
        const url = new URL(window.location.href);
        url.searchParams.set('uchMode', mode);
        history.replaceState(null, '', url.pathname + url.search + url.hash);
        startup.style.display = 'none';
        loading.style.display = 'grid';
        label.textContent = mode === 'performance' ? 'Loading in Performance mode…' : 'Loading in Normal mode…';

        const pixelRatio = mode === 'performance'
          ? Math.min(window.devicePixelRatio || 1, 0.75)
          : (window.devicePixelRatio || 1);

        try {
          await createUnityInstance(canvas, {
            dataUrl: 'Build/UCH-WebGL-MovementDiagnostics-20261123-220843.data',
            frameworkUrl: 'Build/UCH-WebGL-MovementDiagnostics-20261123-220843.framework.js',
            codeUrl: 'Build/UCH-WebGL-MovementDiagnostics-20261123-220843.wasm',
            streamingAssetsUrl: 'StreamingAssets',
            companyName: 'Clever Endeavour Games',
            productName: 'Ultimate Chicken Horse',
            productVersion: '1.13.13.779.4563fd9.REL',
            devicePixelRatio: pixelRatio
          }, value => {
            progress.style.width = `${Math.round(value * 100)}%`;
          });
          loading.style.display = 'none';
        } catch (error) {
          label.textContent = 'The game could not start.';
          failure.textContent = String(error);
          failure.style.display = 'block';
          console.error('[UCH startup]', error);
        }
      }

      document.querySelector('#normal').addEventListener('click', () => startGame('normal'));
      document.querySelector('#performance').addEventListener('click', () => startGame('performance'));
    </script>
  </body>
</html>
