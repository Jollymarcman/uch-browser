name: Deploy Unity WebGL to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site, including Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static WebGL site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
